# =================================================================
# 样本级别超图融合训练配置 - Hydra 格式
# =================================================================

# 数据集配置
dataset:
  # 数据集名称: MOSEI 或 MELD
  name: MELD

  # 数据目录路径
  data_dir: ./output/meld_utterance_features

  # Seen emotions (有标签，用于训练和测试)
  seen_emotions:
    happy: 0
    sad: 1

  # Unseen emotions (无标签，可选)
  unseen_emotions:
    fear: 5

  # 训练集比例 (仅用于 MOSEI)
  train_ratio: 0.7

  # 是否合并 train 和 dev (仅用于 MELD)
  merge_train_dev: true

# 数据加载配置
dataloader:
  batch_size: 32
  num_workers: 4
  shuffle_train: true
  pin_memory: true

# 模型配置
model:
  # 编码器配置
  encoder:
    hidden_dim: 256
    output_dim: 256
    dropout: 0.1

  # 超图配置
  hypergraph:
    hidden_dim: 256
    num_conv_layers: 2

  # 池化配置
  pooling:
    pooling_type: masked_mean  # masked_mean, max, last

  # 样本级别超图特有配置
  sample_hypergraph:
    use_edge_weights: true
    similarity_temperature: 1.0

# 训练配置
training:
  # 训练轮数
  epochs: 50

  # 学习率
  learning_rate: 0.0001

  # 权重衰减
  weight_decay: 0.0001

  # 学习率调度器
  scheduler:
    use_scheduler: true
    mode: max  # 监控准确率
    factor: 0.5
    patience: 5

  # 早停
  early_stopping:
    use_early_stopping: true
    patience: 10

  # 梯度裁剪
  gradient_clipping:
    use_grad_clip: false
    max_norm: 1.0

# 系统配置
system:
  # 设备: cuda 或 cpu
  device: cuda

  # 随机种子
  random_seed: 42

  # 保存目录
  save_dir: ./checkpoints

  # 日志目录
  log_dir: ./logs

  # 混合精度训练
  use_amp: false

# 实验配置
experiment:
  # 实验名称
  name: sample_hypergraph_happy_sad

  # 实验描述
  description: 使用样本级别超图进行happy和sad二分类

  # 保存最佳模型
  save_best_model: true

  # 保存检查点
  save_checkpoints: true

  # 检查点保存频率
  checkpoint_frequency: 10
