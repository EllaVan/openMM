# ============================================================================
# 跨域零样本持续学习配置文件
# ============================================================================

# 任务配置
task:
  type: black
  config_path: /media/sda/wf/openMM/codes_v251119_2/config/tasks.json
  num_tasks: 3
  exclude_neutral: true

# AU-EMO先验配置
prior:
  au_prior_path: /media/sda/wf/openMM/codes_v251119_2/materials/au_emo_prior.json
  num_aus: 23
  prior_strength: 0.1

# 数据加载配置
dataloader:
  batch_size: 32
  num_workers: 4
  train_ratio: 0.8
  shuffle_train: true
  pin_memory: true

# 网络架构配置
network:
  text_dim: 768
  audio_dim: 768
  video_dim: 768
  encoder_hidden_dim: 256
  encoder_output_dim: 256
  hypergraph_hidden_dim: 256
  num_hyperedges: 64
  num_conv_layers: 2
  dropout: 0.1

# 持续学习配置
continual_learning:
  # EWC防遗忘
  use_ewc: true
  ewc_lambda: 1000.0

  # AU-EMO矩阵正则化
  matrix_reg_lambda: 0.1

  # 多模态一致性检查
  consistency_strategy: majority  # choices: all_agree, majority, weighted_vote, entropy_threshold, combined
  min_confidence: 0.8

  # 损失权重
  seen_loss_weight: 1.0
  unseen_loss_weight: 0.3

# 训练配置
training:
  epochs_per_task: 20
  warmup_epochs: 3  # Task 0的预热轮数
  learning_rate: 1.0e-4
  matrix_learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  gradient_clip: 1.0

# 输出配置
output:
  save_dir: /media/sda/wf/openMM/codes_v251119_2/checkpoints
  log_dir: /media/sda/wf/openMM/codes_v251119_2/logs
  log_interval: 10
  save_frequency: 5  # 每5个epoch保存一次

# 系统配置
system:
  device: cuda:0
  seed: 2025
  num_workers: 4
