# =================================================================
# 多模态融合训练配置文件
# =================================================================

# -----------------------------------------------------------------
# 1. 数据集配置
# -----------------------------------------------------------------
dataset:
  # 数据集名称: MOSEI 或 MELD
  name: "MOSEI"

  # 数据目录路径
  data_dir: "./output/mosei_utterance_features"

  # Seen emotions (有标签，用于训练和测试)
  # 格式: emotion名称 -> label_id
  seen_emotions:
    happy: 0
    sad: 1

  # Unseen emotions (无标签，用于无监督学习或零样本学习)
  # 格式: emotion名称 -> label_id
  unseen_emotions:
    fear: 5

  # 训练集比例 (仅用于 MOSEI，MELD 自带 train/dev/test 划分)
  train_ratio: 0.7

  # 是否合并 train 和 dev 作为训练集 (仅用于 MELD)
  merge_train_dev: true

# -----------------------------------------------------------------
# 2. 数据加载配置
# -----------------------------------------------------------------
dataloader:
  batch_size: 32
  num_workers: 4
  shuffle_train: true
  pin_memory: true

# -----------------------------------------------------------------
# 3. 模型配置
# -----------------------------------------------------------------
model:
  # 编码器配置
  encoder:
    hidden_dim: 256
    output_dim: 256
    dropout: 0.1

  # 超图配置
  hypergraph:
    hidden_dim: 256
    num_hyperedges: 64
    num_conv_layers: 2
    hyperedge_drop_rate: 0.2

  # Bottleneck 配置
  bottleneck:
    use_bottleneck: true
    bottleneck_dim: 128

  # 对比学习配置
  contrastive:
    use_contrastive: true
    contrastive_weight: 0.1

# -----------------------------------------------------------------
# 4. 训练配置
# -----------------------------------------------------------------
training:
  # 训练轮数
  epochs: 50

  # 学习率
  learning_rate: 0.0001

  # 权重衰减
  weight_decay: 0.0001

  # 学习率调度器
  scheduler:
    use_scheduler: true
    mode: "max"  # 监控准确率
    factor: 0.5
    patience: 5

  # 早停
  early_stopping:
    use_early_stopping: true
    patience: 10

  # 梯度裁剪
  gradient_clipping:
    use_grad_clip: false
    max_norm: 1.0

# -----------------------------------------------------------------
# 5. 系统配置
# -----------------------------------------------------------------
system:
  # 设备: cuda 或 cpu
  device: "cuda"

  # 随机种子
  random_seed: 2025

  # 保存目录
  save_dir: "./checkpoints"

  # 日志目录
  log_dir: "./logs"

  # 是否启用混合精度训练
  use_amp: false

# -----------------------------------------------------------------
# 6. 实验配置 (可选)
# -----------------------------------------------------------------
experiment:
  # 实验名称
  name: "fusion_seen_happy_sad_unseen_fear"

  # 实验描述
  description: "训练happy和sad的二分类模型，使用fear作为unseen emotion"

  # 是否保存最佳模型
  save_best_model: true

  # 是否保存检查点
  save_checkpoints: true

  # 检查点保存频率 (每多少个epoch)
  checkpoint_frequency: 10
